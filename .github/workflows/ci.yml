name: Brevity verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: node scripts/audit-production.mjs
      - name: Run automated tests
        run: npm test
      - name: Build production application
        run: npm run build
      - name: Enforce production bundle budget
        run: node scripts/check-bundle-budget.mjs
