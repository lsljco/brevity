name: Brevity verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: node scripts/audit-production.mjs
      - name: Run automated tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Preserve failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-test-output
          path: test-output.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Enforce Finance source budget
        run: node scripts/check-source-budget.mjs
      - name: Build production application
        run: npm run build
      - name: Enforce production bundle budget
        run: node scripts/check-bundle-budget.mjs
