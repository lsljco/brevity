name: Brevity iPhone Health
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios-health.yml']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios-health.yml']
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test daily boundaries and workout overlap handling
        run: swift test --package-path ios/BrevityHealth/Core
      - name: Build iPhone simulator application
        run: xcodebuild -project ios/BrevityHealth/BrevityHealth.xcodeproj -scheme BrevityHealth -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/BrevityHealthBuild CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iPhone archive for signing readiness
        run: xcodebuild -project ios/BrevityHealth/BrevityHealth.xcodeproj -scheme BrevityHealth -configuration Release -destination 'generic/platform=iOS' -archivePath /tmp/BrevityHealth.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - name: Preserve unsigned archive
        uses: actions/upload-artifact@v4
        with:
          name: BrevityHealth-unsigned-archive
          path: /tmp/BrevityHealth.xcarchive
          retention-days: 7
