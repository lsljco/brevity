name: Home viewport layout
on:
  pull_request:
    paths:
      - 'src/homehq/HomeDashboard.css'
      - 'e2e/home-dashboard.spec.mjs'
      - '.github/workflows/home-layout-check.yml'
permissions:
  contents: read
jobs:
  home-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test home-dashboard --workers=4
      - name: Verify recording navigation, grocery handoff, and report exports
        run: npx playwright test critical-workflows --grep 'recording survives Meal Plan|weekly groceries add only|financial workspaces expose working exports' --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-layout-audit
          path: test-results/
