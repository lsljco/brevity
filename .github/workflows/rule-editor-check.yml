name: Transaction rule editor
on:
  pull_request:
    paths:
      - 'src/finance/**'
      - 'netlify/lib/assistant-action-*.mjs'
      - 'e2e/critical-workflows.spec.mjs'
      - '.github/workflows/rule-editor-check.yml'
permissions:
  contents: read
jobs:
  rule-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test critical-workflows --grep 'categorization rules|prefilled rule' --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rule-editor-audit
          path: test-results/
