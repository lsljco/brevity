name: Meeting budget interface
on:
  pull_request:
    paths:
      - 'src/finance/**'
      - 'e2e/meeting-budget-filters.spec.mjs'
      - '.github/workflows/meeting-budget-check.yml'
permissions:
  contents: read
jobs:
  budget-interface:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test meeting-budget-filters --workers=4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meeting-budget-interface
          path: test-results/
