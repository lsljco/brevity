<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brevity release verification</title>
<style>body{background:#11100d;color:#eee8dc;font:16px system-ui;margin:2rem auto;max-width:1000px;padding:1rem}button{background:#c5a46d;color:#16130e;border:0;padding:1rem;border-radius:.6rem;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#201e18;padding:1rem}summary{padding:.7rem;cursor:pointer}.pass{color:#9dddac}.fail{color:#ffb8ae}a{color:#dcc49b}</style>
<h1>Brevity release verification</h1><p>Administrator checks on synthetic fixtures. No household records are read or changed. Model responses require correctness review; structural checks alone do not approve a release.</p><button id="run" disabled>Run release checks</button> <button id="failed" hidden>Rerun failed cases</button><p id="status" role="status">Checking preview access…</p><section id="results"></section><details><summary>Complete result JSON</summary><pre id="raw"></pre></details>
<script type="module">
const endpoint='/.netlify/functions/brevity-release-checks',status=document.querySelector('#status'),button=document.querySelector('#run'),failed=document.querySelector('#failed');let last=null;
async function api(path,options){const r=await fetch(endpoint+path,{credentials:'same-origin',...options});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function show(job){last=job;status.textContent=`${job.state}: ${job.results.length}/${job.caseIds.length} cases returned · build ${job.build.commit.slice(0,7)}`;const root=document.querySelector('#results');root.replaceChildren();for(const result of job.results){const item=document.createElement('details'),title=document.createElement('summary'),text=document.createElement('pre');title.textContent=`${result.structuralPass?'PASS':'REVIEW'} — ${result.id}`;title.className=result.structuralPass?'pass':'fail';text.textContent=JSON.stringify(result,null,2);item.append(title,text);root.append(item)}document.querySelector('#raw').textContent=JSON.stringify(job,null,2);failed.hidden=job.state!=='complete'||job.results.every(item=>item.structuralPass)}
async function poll(id){try{const job=await api('?id='+encodeURIComponent(id));show(job);if(['queued','running'].includes(job.state))setTimeout(()=>poll(id),2500);else button.disabled=false}catch(e){status.textContent=e.message;button.disabled=false}}
async function start(caseIds){button.disabled=true;failed.hidden=true;try{const {id}=await api('',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(caseIds?{caseIds}:{})});sessionStorage.setItem('brevityReleaseRun',id);poll(id)}catch(e){status.textContent=e.message;button.disabled=false}}
button.onclick=()=>start();failed.onclick=()=>start(last.results.filter(item=>!item.structuralPass).map(item=>item.id));
try{const data=await api('');status.textContent=`Preview ${data.build.commit.slice(0,7)} · ${data.cases.length} cases ready`;button.textContent=`Run all ${data.cases.length} cases`;button.disabled=false;const previous=sessionStorage.getItem('brevityReleaseRun');if(previous)poll(previous)}catch(e){status.textContent=e.message}
</script></html>
